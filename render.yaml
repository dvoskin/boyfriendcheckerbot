# Render blueprint. This bot uses Telegram long-polling, so it is a *worker*
# (no inbound HTTP, no port, no public URL) — not a web service. Note Render
# background workers are a paid plan; a free web service would spin down on idle
# and kill the poller, so this is intentionally a worker.
services:
  - type: worker
    name: recon-bot
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    # Persist the audit log and consent list across deploys. Without a disk the
    # data/ directory is wiped on every redeploy.
    disk:
      name: recon-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: CONTACT_EMAIL
        value: danny@goalsplasticsurgery.com
      # How often the watch loop re-checks (minutes). Lower it while testing.
      - key: WATCH_INTERVAL_MIN
        value: "360"
      # Secrets: declared here so the blueprint knows them, but their VALUES are
      # entered in the Render dashboard (Environment tab), never committed.
      - key: BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Brave: powers name search + the sex-offender registry check.
      - key: BRAVE_API_KEY
        sync: false
      # SerpAPI: powers reverse image / catfish detection.
      - key: SERPAPI_KEY
        sync: false
      # Twilio: phone number -> registered name.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Enformion: deep-background aggregator (relatives, marriage, records).
      - key: ENFORMION_AP_NAME
        sync: false
      - key: ENFORMION_AP_PASSWORD
        sync: false
      # FEC works without a key; add one from api.data.gov to lift rate limits.
      - key: FEC_API_KEY
        sync: false
      - key: OPENCORPORATES_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
